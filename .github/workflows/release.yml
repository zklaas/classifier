# Build downloadable Classifier packages (Linux) and attach them to a GitHub
# Release.
#
#   Start it:  Actions > "Release packages" > Run workflow (give a version, e.g. 1.0.1)
#              or push a tag such as v1.0.1
#
# Each package bundles Python and everything Classifier uses (built by PyInstaller), so
# people need nothing else. Asset names stay the same from release to release, so
#   https://github.com/zklaas/classifier/releases/latest/download/<name>
# always gives the newest one.
name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.1)"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04            # older Linux base: the AppImage runs on more systems
            icon: icons/classifier.png
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: python -m pip install pyinstaller PyQt6

      - name: Linux libraries Qt needs (for the start-up check)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libfuse2 libportaudio2 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2

      - name: Build with PyInstaller
        shell: bash
        run: >
          pyinstaller --noconfirm --clean --windowed --name Classifier
          --icon "${{ matrix.icon }}"
          --add-data "icons${{ matrix.sep }}icons"
          --add-data "claude-classifier-docker/make.py${{ matrix.sep }}claude-classifier-docker"
          classifier_app.py

      - name: Check that it starts
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = macOS ]; then EXE=dist/Classifier.app/Contents/MacOS/Classifier
          elif [ "$RUNNER_OS" = Windows ]; then EXE=dist/Classifier/Classifier.exe
          else EXE=dist/Classifier/Classifier; fi
          # the window: still running after 25 s = it started (Python's timeout works everywhere)
          python - "$EXE" <<'PY'
          import subprocess, sys
          try:
              subprocess.run([sys.argv[1]], timeout=25)
          except subprocess.TimeoutExpired:
              print("window started"); sys.exit(0)
          sys.exit("the window closed by itself")
          PY

      - name: Package for Linux (AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release AppDir/usr/bin
          cp -R dist/Classifier/. AppDir/usr/bin/
          cp icons/classifier.png AppDir/classifier.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Classifier' \
            'Comment=Development Groups, clearance and licences for your software' 'Exec=Classifier' 'Icon=classifier' 'Categories=Utility;' > AppDir/classifier.desktop
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/Classifier" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir release/Classifier-Linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION#v}"
          ls -la packages
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/* --clobber
          else
            gh release create "$TAG" packages/* --target "$GITHUB_SHA" \
              --title "Classifier ${VERSION#v}" --notes-file packaging/release-notes.md
          fi
